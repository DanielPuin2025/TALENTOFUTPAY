<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentoFutPay</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v='20261017') }}">

    <style>
        body{
            position: relative;
            background: linear-gradient(135deg, #dff3e4 0%, #eef7ef 100%);
            font-family:'Nunito', Arial, sans-serif;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            overflow:hidden;
        }

        .fondo-futbol {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url('/static/img/fondo2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        .fondo-futbol::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
        }

        .contenedor{
            position: relative;
            z-index: 1;
            max-width:950px;
            width:100%;
            margin:0 auto;
            background: rgba(255,255,255,.92);
            border: 1px solid rgba(15, 81, 63, 0.08);
            border-radius: 22px;
            padding: 38px 30px 30px;
            box-shadow: 0 18px 45px rgba(10, 40, 31, 0.14);
            backdrop-filter: blur(2px);
        }

        .titulo{
            display:flex;
            align-items:center;
            justify-content:center;
            margin-bottom:18px;
        }

        .logo{
            width:240px;
            max-width:100%;
            height:auto;
        }

        h2{
            margin-top:12px;
            margin-bottom:14px;
            text-align:center;
            color:#000000;
            font-family:'Bree Serif', Georgia, serif;
            font-size:38px;
            letter-spacing:.2px;
        }

        p{
            max-width:760px;
            margin:0 auto 22px;
            text-align:center;
            color:#334155;
            font-family:'Nunito', Arial, sans-serif;
            font-size:20px;
            font-weight:600;
            line-height:1.5;
        }

        .formulario-acceso{
            max-width:520px;
            margin:24px auto 0;
            background: rgba(248, 251, 250, 0.96);
            border:1px solid #edf3ef;
            border-radius:14px;
            padding:24px 22px 18px;
        }

        .campo-acceso{
            margin-bottom:16px;
        }

        .campo-acceso label{
            display:block;
            margin-bottom:7px;
            font-weight:800;
            color:#1f2937;
        }

        .campo-acceso input{
            width:100%;
            padding:13px 14px;
            border:1px solid #cbd5e1;
            border-radius:10px;
            font-size:16px;
            background:#fff;
        }

        .btn-ingresar{
            width:100%;
            margin-top:16px;
            font-size:20px;
            font-weight:800;
            border-radius:10px;
        }

        .error-acceso{
            padding:12px 14px;
            margin-bottom:18px;
            border-radius:10px;
            color:#991b1b;
            background:#fee2e2;
            border:1px solid #fecaca;
            font-weight:700;
        }

        .descripcion-inicio {
            font-family: "Bodoni MT Black", "Bodoni MT", serif;
            font-size: 1.3rem;
            color: #000000;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(11, 45, 92, 0.95);
            color: white;
            text-align: center;
            padding: 12px 20px;
            font-size: 14px;
            z-index: 2;
            backdrop-filter: blur(10px);
        }

        .footer a {
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                min-height: 100svh;
                height: auto;
                flex-direction: column;
                align-items: stretch;
                overflow-x: hidden;
                overflow-y: auto;
                padding: 16px 12px;
            }

            .contenedor {
                width: 100%;
                flex: 0 0 auto;
                margin: auto 0 0;
                padding: 24px 18px 20px;
                border-radius: 16px;
            }

            .logo {
                width: clamp(150px, 55vw, 210px);
            }

            h2 {
                font-size: clamp(28px, 9vw, 36px);
            }

            p {
                font-size: 17px;
            }

            .descripcion-inicio {
                font-size: 1.1rem;
            }

            .formulario-acceso {
                margin-top: 18px;
                padding: 18px 14px 16px;
            }

            .btn-ingresar {
                min-height: 48px;
                font-size: 18px;
            }

            .footer {
                position: static;
                flex: 0 0 auto;
                margin: 16px 0 0;
                width: 100%;
                padding: 12px;
            }
        }
    </style>

</head>
<body>

<div class="fondo-futbol" aria-hidden="true">
    <!-- Líneas de cancha -->
    <div class="cancha-lineas">
        <div class="linea-campo linea-h1"></div>
        <div class="linea-campo linea-h2"></div>
        <div class="linea-campo linea-h3"></div>
        <div class="linea-campo linea-v1"></div>
        <div class="linea-campo linea-v2"></div>
        <div class="circulo-central"></div>
    </div>

    <!-- Siluetas de jugadoras en diferentes posiciones -->
    <div class="jugadora-silueta arquera" title="Arquera">🧤</div>
    <div class="jugadora-silueta defensa" title="Defensa">🛡️</div>
    <div class="jugadora-silueta mediocampista" title="Mediocampista">⚽</div>
    <div class="jugadora-silueta delantera" title="Delantera">⚡</div>

    <!-- Decoración dinámica -->
    <div class="decoracion-dinamica deco-1"></div>
    <div class="decoracion-dinamica deco-2"></div>
    <div class="decoracion-dinamica deco-3"></div>
</div>

<div class="contenedor">

    <div class="titulo">

        <img src="{{ url_for('static', filename='img/logo-transparente.png') }}" class="logo" alt="Logo TalentoFutPay">

    </div>

    <h2>TalentoFutPay</h2>

    <p class="descripcion-inicio">
        Sistema para la gestión segura y organizada de pagos del equipo de fútbol formativo.
    </p>

    <form method="POST" class="formulario-acceso">
        {% if error %}
            <div class="error-acceso">{{ error }}</div>
        {% endif %}

        <div class="campo-acceso">
            <label for="usuario">Usuario</label>
            <input id="usuario" name="usuario" type="text" autocomplete="username" required>
        </div>

        <div class="campo-acceso">
            <label for="clave">Contraseña</label>
            <input id="clave" name="clave" type="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-success btn-lg btn-ingresar">
            Ingresar al sistema
        </button>
    </form>

</div>

<div class="footer">
    © 2026 TalentoFutPay - Todos los derechos reservados |
    <a href="/acerca">Ver Creadoras</a>
</div>

</body>
</html>

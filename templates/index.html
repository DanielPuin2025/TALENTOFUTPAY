<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentoFutPay</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">

    <style>
        body{
            position: relative;
            background: linear-gradient(135deg, #dff3e4 0%, #eef7ef 100%);
            font-family:'Nunito', Arial, sans-serif;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            overflow:hidden;
        }

        .fondo-futbol {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                linear-gradient(135deg, #0d8f38 0%, #1f9d52 30%, #0c7f2f 55%, #0c6a2b 100%);
            overflow: hidden;
        }

        .fondo-futbol::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.10) 0 2px, transparent 3px),
                linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.00));
            opacity: 0.8;
        }

        .pincel {
            position: absolute;
            border-radius: 999px;
            opacity: 0.9;
            filter: blur(0.2px);
        }

        .pincel-1 {
            width: 980px; height: 120px;
            left: -250px; top: 16%;
            background: linear-gradient(90deg, rgba(18,18,18,0.96), rgba(18,18,18,0.72), rgba(0,0,0,0.08));
            transform: rotate(-30deg);
        }

        .pincel-2 {
            width: 900px; height: 110px;
            right: -180px; top: 28%;
            background: linear-gradient(90deg, rgba(255,217,51,0.96), rgba(250,226,91,0.88), rgba(255,255,255,0.06));
            transform: rotate(25deg);
        }

        .pincel-3 {
            width: 860px; height: 110px;
            left: -140px; bottom: 18%;
            background: linear-gradient(90deg, rgba(43,118,255,0.96), rgba(127,174,255,0.88), rgba(255,255,255,0.06));
            transform: rotate(22deg);
        }

        .pincel-4 {
            width: 760px; height: 100px;
            right: 11%; bottom: 18%;
            background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(255,255,255,0.55), rgba(255,255,255,0.10));
            transform: rotate(-8deg);
        }

        .pincel-5 {
            width: 760px; height: 110px;
            left: 8%; bottom: 16%;
            background: linear-gradient(90deg, rgba(0,0,0,0.95), rgba(0,0,0,0.68), rgba(0,0,0,0.08));
            transform: rotate(20deg);
        }

        .balon {
            position: absolute;
            width: 172px; height: 172px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 28%, #f6f7fb 0 15%, #edf1f5 15% 18%, #0f172a 18% 22%, #f6f7fb 22% 38%, #0f172a 38% 42%, #f6f7fb 42% 58%, #0f172a 58% 62%, #f6f7fb 62% 78%, #0f172a 78% 80%, #f6f7fb 80% 100%);
            box-shadow: inset 0 0 14px rgba(15,23,42,0.20), 0 14px 20px rgba(0,0,0,0.12);
            border: 7px solid rgba(255,255,255,0.18);
        }

        .balon::before {
            content: "";
            position: absolute;
            inset: 14%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 50%, transparent 0 53%, rgba(0,0,0,0.9) 53% 58%, transparent 58% 100%),
                radial-gradient(circle at 35% 35%, transparent 0 18%, rgba(0,0,0,0.9) 18% 21%, transparent 21% 100%),
                radial-gradient(circle at 68% 68%, transparent 0 18%, rgba(0,0,0,0.9) 18% 21%, transparent 21% 100%);
        }

        .balon::after {
            content: "";
            position: absolute;
            inset: 16%;
            border-radius: 50%;
            background: conic-gradient(from 90deg,
                #f8fafc 0 18%, #0f172a 18% 34%, #f8fafc 34% 52%, #0f172a 52% 68%, #f8fafc 68% 84%, #0f172a 84% 100%);
            mix-blend-mode: multiply;
            opacity: 0.8;
        }

        .balon-1 { left: 9%; top: 10%; }
        .balon-2 { right: 9%; top: 12%; }
        .balon-3 { left: 17%; bottom: 10%; }
        .balon-4 { right: 17%; bottom: 7%; }

        .contenedor{
            position: relative;
            z-index: 1;
            max-width:950px;
            width:100%;
            margin:0 auto;
            background: rgba(255,255,255,.92);
            border: 1px solid rgba(15, 81, 63, 0.08);
            border-radius: 22px;
            padding: 38px 30px 30px;
            box-shadow: 0 18px 45px rgba(10, 40, 31, 0.14);
            backdrop-filter: blur(2px);
        }

        .titulo{
            display:flex;
            align-items:center;
            justify-content:center;
            margin-bottom:18px;
        }

        .logo{
            width:240px;
            max-width:100%;
            height:auto;
        }

        h2{
            margin-top:12px;
            margin-bottom:14px;
            text-align:center;
            color:#000000;
            font-family:'Bree Serif', Georgia, serif;
            font-size:38px;
            letter-spacing:.2px;
        }

        p{
            max-width:760px;
            margin:0 auto 22px;
            text-align:center;
            color:#334155;
            font-family:'Nunito', Arial, sans-serif;
            font-size:20px;
            font-weight:600;
            line-height:1.5;
        }

        .formulario-acceso{
            max-width:520px;
            margin:24px auto 0;
            background: rgba(248, 251, 250, 0.96);
            border:1px solid #edf3ef;
            border-radius:14px;
            padding:24px 22px 18px;
        }

        .campo-acceso{
            margin-bottom:16px;
        }

        .campo-acceso label{
            display:block;
            margin-bottom:7px;
            font-weight:800;
            color:#1f2937;
        }

        .campo-acceso input{
            width:100%;
            padding:13px 14px;
            border:1px solid #cbd5e1;
            border-radius:10px;
            font-size:16px;
            background:#fff;
        }

        .btn-ingresar{
            width:100%;
            margin-top:16px;
            font-size:20px;
            font-weight:800;
            border-radius:10px;
        }

        .error-acceso{
            padding:12px 14px;
            margin-bottom:18px;
            border-radius:10px;
            color:#991b1b;
            background:#fee2e2;
            border:1px solid #fecaca;
            font-weight:700;
        }

        .descripcion-inicio {
            font-family: "Bodoni MT Black", "Bodoni MT", serif;
            font-size: 1.3rem;
            color: #000000;
        }
    </style>

</head>
<body>

<div class="fondo-futbol" aria-hidden="true">
    <div class="pincel pincel-1"></div>
    <div class="pincel pincel-2"></div>
    <div class="pincel pincel-3"></div>
    <div class="pincel pincel-4"></div>
    <div class="pincel pincel-5"></div>
    <div class="balon balon-1"></div>
    <div class="balon balon-2"></div>
    <div class="balon balon-3"></div>
    <div class="balon balon-4"></div>
</div>

<div class="contenedor">

    <div class="titulo">

        <img src="{{ url_for('static', filename='img/logo-transparente.png') }}" class="logo" alt="Logo TalentoFutPay">

    </div>

    <h2>TalentoFutPay</h2>

    <p class="descripcion-inicio">
        Sistema para la gestión segura y organizada de pagos del equipo de fútbol formativo.
    </p>

    <form method="POST" class="formulario-acceso">
        {% if error %}
            <div class="error-acceso">{{ error }}</div>
        {% endif %}

        <div class="campo-acceso">
            <label for="usuario">Usuario</label>
            <input id="usuario" name="usuario" type="text" autocomplete="username" required>
        </div>

        <div class="campo-acceso">
            <label for="clave">Contraseña</label>
            <input id="clave" name="clave" type="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-success btn-lg btn-ingresar">
            Ingresar al sistema
        </button>
    </form>

</div>

</body>
</html>

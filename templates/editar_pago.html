<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Pago - TalentoFutPay</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v='20261017') }}">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #eef2f7;
        }

        /* MENÚ */

        .menu {
            width: 240px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: #0b2d5c;
            color: white;
            padding: 25px 20px;
        }

        .menu h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        .menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .menu a:hover {
            background: #2ecc71;
        }

        /* CONTENIDO */

        .contenido {
            margin-left: 240px;
            padding: 35px;
        }

        .encabezado {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,.10);
        }

        .encabezado h1 {
            color: #0b2d5c;
        }

        .formulario {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 700px;
            box-shadow: 0 5px 15px rgba(0,0,0,.10);
        }

        .formulario h2 {
            color: #0b2d5c;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .boton {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .boton:hover {
            background: #27ae60;
        }

        .cancelar {
            background: #777;
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 8px;
            margin-left: 10px;
        }

        .cancelar:hover {
            background: #555;
        }

        @media (max-width: 800px) {
            .menu { position: relative; width: 100%; height: auto; padding: 16px; }
            .menu a { display: inline-block; padding: 10px; margin: 3px 0; }
            .contenido { margin-left: 0; padding: 18px; }
            .formulario { max-width: 100%; }
        }
    </style>

</head>

<body>

    <!-- MENÚ -->

    <div class="menu">

        <h2><img src="{{ url_for('static', filename='img/logo-transparente.png') }}" alt="TalentoFutPay" style="width:220px; max-width:100%; height:auto;"></h2>

        <a href="/">Inicio</a>

        <a href="/dashboard">Resumen general</a>

        <a href="/jugadoras">Jugadoras</a>

        <a href="/pagos">Pagos</a>

        <a href="/reportes">Reportes</a>

        <a href="/torneos">Torneos</a>

        <a href="/recordatorios_pendientes">Recordatorios</a>

        {% if session.rol == 'admin' %}
        <a href="/panel_admin">Panel Administrador</a>
        {% endif %}

        <a href="/cerrar_sesion" onclick="return confirm('¿Está seguro de que desea cerrar sesión?');">Cerrar sesión</a>

        <a href="/cambiar_clave">Cambiar contraseña</a>

        <a href="/descargar_respaldo">Descargar respaldo</a>

    </div>


    <!-- CONTENIDO -->

    <div class="contenido">

        <div class="encabezado">

            <h1>✏️ Editar Pago</h1>

        </div>


        <div class="formulario">

            <h2>Modificar información del pago</h2>

            <form method="POST">

                <!-- JUGADORA -->

                <div class="campo">

                    <label>Seleccionar jugadora</label>

                    <select name="jugadora_id" required>

                        {% for jugadora in jugadoras %}

                            <option
                                value="{{ jugadora.id }}"
                                {% if pago.jugadora_id == jugadora.id %}selected{% endif %}
                            >
                                {{ jugadora.nombre }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- MES -->

                <div class="campo">

                    <label>Mes</label>

                    <select name="mes" required>

                        <option value="Enero"
                            {% if pago.mes == "Enero" %}selected{% endif %}>
                            Enero
                        </option>

                        <option value="Febrero"
                            {% if pago.mes == "Febrero" %}selected{% endif %}>
                            Febrero
                        </option>

                        <option value="Marzo"
                            {% if pago.mes == "Marzo" %}selected{% endif %}>
                            Marzo
                        </option>

                        <option value="Abril"
                            {% if pago.mes == "Abril" %}selected{% endif %}>
                            Abril
                        </option>

                        <option value="Mayo"
                            {% if pago.mes == "Mayo" %}selected{% endif %}>
                            Mayo
                        </option>

                        <option value="Junio"
                            {% if pago.mes == "Junio" %}selected{% endif %}>
                            Junio
                        </option>

                        <option value="Julio"
                            {% if pago.mes == "Julio" %}selected{% endif %}>
                            Julio
                        </option>

                        <option value="Agosto"
                            {% if pago.mes == "Agosto" %}selected{% endif %}>
                            Agosto
                        </option>

                        <option value="Septiembre"
                            {% if pago.mes == "Septiembre" %}selected{% endif %}>
                            Septiembre
                        </option>

                        <option value="Octubre"
                            {% if pago.mes == "Octubre" %}selected{% endif %}>
                            Octubre
                        </option>

                        <option value="Noviembre"
                            {% if pago.mes == "Noviembre" %}selected{% endif %}>
                            Noviembre
                        </option>

                        <option value="Diciembre"
                            {% if pago.mes == "Diciembre" %}selected{% endif %}>
                            Diciembre
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label>Fecha del pago</label>

                    <input type="date" name="fecha" value="{{ pago.fecha }}" required>

                </div>


                <!-- VALOR -->

                <div class="campo">

                    <label>Valor del pago (Mensualidad: $80.000)</label>

                    <input
                        type="number"
                        name="valor"
                        value="{{ pago.valor }}"
                        min="0"
                        max="80000"
                        required
                    >

                </div>

                <div class="campo">
                    <label>Método de pago</label>
                    <select name="metodo_pago" required>
                        <option value="Efectivo" {% if pago.metodo_pago == "Efectivo" %}selected{% endif %}>Efectivo</option>
                        <option value="Transferencia" {% if pago.metodo_pago == "Transferencia" %}selected{% endif %}>Transferencia</option>
                        <option value="Nequi" {% if pago.metodo_pago == "Nequi" %}selected{% endif %}>Nequi</option>
                    </select>
                </div>


                <!-- ESTADO -->

                <div class="campo">

                    <label>Estado</label>

                    <select name="estado" required>

                        <option value="Pagado"
                            {% if pago.estado == "Pagado" %}selected{% endif %}>
                            ✅ Pagado
                        </option>

                        <option value="Pendiente"
                            {% if pago.estado == "Pendiente" %}selected{% endif %}>
                            ⏳ Pendiente
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="boton"
                >
                    💾 Guardar cambios
                </button>


                <a
                    href="/pagos"
                    class="cancelar"
                >
                    ↩ Cancelar
                </a>

            </form>

        </div>

    </div>

</body>

</html>

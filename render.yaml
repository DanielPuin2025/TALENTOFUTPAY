services:
  - type: web
    name: talentofutpay
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: TALENTOFUTPAY_SECRET_KEY
        generateValue: true
      - key: TALENTOFUTPAY_USER
        sync: false
      - key: TALENTOFUTPAY_PASSWORD
        sync: false
      - key: TALENTOFUTPAY_HOST
        value: 0.0.0.0
      - key: TALENTOFUTPAY_PORT
        value: "5000"
